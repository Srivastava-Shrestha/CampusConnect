[project]
name = "Campus-Connect"
version = "0.1.0"
description = "Backend codes for Campus-Connect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.40.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.1",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]
