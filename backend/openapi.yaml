  /events/{event_id}/register:
    post:
      tags:
      - Events
      summary: Register for an event
      description: |-
        **User story 3.2 - Register for an Event** (Epic 3 - Event Lifecycle)

        > As a student, I want to register for an event and immediately receive an on-platform confirmation with a unique registration ID, so that I have a retrievable record that my spot is secured without needing to message the organizer.

        Secures a seat and returns the confirmation immediately, including a unique `registration_id` - the retrievable proof that replaces messaging an organiser to ask whether a spot went through.

        **Every precondition below must hold**, checked in this order:

        | Condition | Failure |
        |---|---|
        | Event exists in the caller's college | `404 Event not found` |
        | Event is `PUBLISHED` | `403 Event is not open for registration` |
        | Event has not started | `403 Registration for this event is closed` |
        | Caller has an `APPROVED` membership of the hosting club | `403 Only approved club members can register for this event` |
        | Caller is not already registered | `409 You are already registered for this event` |
        | A seat remains | `409 Event has reached its capacity` |

        **Side effect:** a `REGISTRATION_CONFIRMED` notification is written to the student.

        **Access.** `STUDENT` token **and** an `APPROVED` membership of the hosting club.

        **Notes.**

        * Capacity is enforced under a pessimistic row lock on the event, so two students competing for a final seat cannot both succeed. Uncapped events skip the lock entirely.
        * A duplicate registration racing past the existence check is caught at the unique constraint and returns the same `409`.
        * Membership must be `APPROVED`; a `PENDING` join request is not sufficient.
