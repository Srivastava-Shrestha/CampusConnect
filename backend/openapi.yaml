      - JOIN_REJECTED
      - REGISTRATION_CONFIRMED
      - RESULT_POSTED
      - CERTIFICATE_ISSUED
      title: NotificationType
      description: |-
        What a notification is about. Set by the server when the notification is written.

        * `JOIN_APPROVED` / `JOIN_REJECTED` - a leader decided a join request.
        * `REGISTRATION_CONFIRMED` - an event registration succeeded.
        * `RESULT_POSTED` - a result was recorded for an attended event.
        * `CERTIFICATE_ISSUED` - reserved for the certificate workflow, not emitted in this release.
    OpenIssueCountResponse:
      properties:
        count:
          type: integer
