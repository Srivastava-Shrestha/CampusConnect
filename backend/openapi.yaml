components:
  schemas:
    AnnouncementCategory:
      type: string
      enum:
      - GENERAL
      - EVENT_UPDATE
      - RESOURCE
      - ACHIEVEMENT
      - URGENT
      title: AnnouncementCategory
      description: |-
        Classification of a club announcement, used to filter the feed.

        * `GENERAL` - routine club communication.
        * `EVENT_UPDATE` - a change or reminder about an event.
        * `RESOURCE` - shared material or links.
        * `ACHIEVEMENT` - a club or member accomplishment.
        * `URGENT` - time-critical, typically pinned.
    AnnouncementItem:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        author_id:
          type: integer
          title: Author Id
        author_name:
          type: string
          title: Author Name
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        is_pinned:
          type: boolean
          title: Is Pinned
        unread:
          type: boolean
          title: Unread
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - club_id
      - club_name
      - author_id
      - author_name
      - title
      - body
      - category
      - is_pinned
      - unread
      - created_at
      title: AnnouncementItem
      description: One announcement in a feed. `unread` is computed per caller by comparing `created_at`
