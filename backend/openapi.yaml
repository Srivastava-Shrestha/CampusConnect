  /issues/{issue_id}/reply:
    post:
      tags:
      - Issues
      summary: Reply to an issue
      description: |-
        **User story 4.4 - View and Resolve Member Issues** (Epic 4 - Communication and Issue Tracking)

        > As a club leader, I want to see all open issues raised by my members and mark them as resolved, so that I can manage member concerns in one place rather than being flooded with individual DMs.

        Records the leader's answer on an issue and moves it `OPEN` -> `IN_PROGRESS`.

        The reply becomes the `response` block the student reads on `GET /issues`, which is what closes the loop the research found missing - the answer is attached to the query rather than sent separately.

        **Access.** `STUDENT` token **and** a `LEADER` membership on the issue's club.

        **Notes.**

        * One reply is stored per issue. Replying again **overwrites** the previous text, responder and timestamp; there is no threaded history.
        * A `RESOLVED` issue is terminal and cannot be replied to.
        * Replying does not resolve the issue - call the resolve endpoint to close it.
      operationId: reply_to_issue_issues__issue_id__reply_post
      x-epic: Epic 4 - Communication and Issue Tracking
      x-user-story: '4.4'
      x-user-story-title: View and Resolve Member Issues
      x-required-role:
      - STUDENT
      x-required-club-role: LEADER
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Id of an issue on a club the caller leads.
        schema:
          type: integer
          title: Issue Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyIssueRequest'
      responses:
        '200':
          description: The issue after the reply, with status `IN_PROGRESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueActionResponse'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted, or the resource state blocks the action.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
            * `Only the club leader can perform this action` - The caller does not hold a `LEADER` membership on the target club.
            * `A resolved issue cannot be replied to` - The issue is already `RESOLVED`, which is terminal.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NotAuthenticated'
                - $ref: '#/components/schemas/Error'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
                not_leader:
                  summary: Only the club leader can perform this action
                  value:
                    message: Only the club leader can perform this action
                resolved:
                  summary: A resolved issue cannot be replied to
                  value:
                    message: A resolved issue cannot be replied to
        '404':
          description: |-
            The record does not exist, belongs to another college, or is not visible to the caller.

            * `Student profile not found` - The token is valid but the account has no student profile attached.
            * `College not registered` - The calling account is not attached to any college.
            * `Issue not found` - No such issue, or it belongs to another college.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                student_profile_missing:
                  summary: Student profile not found
                  value:
                    message: Student profile not found
                college_missing:
                  summary: College not registered
                  value:
                    message: College not registered
                issue_not_found:
                  summary: Issue not found
                  value:
                    message: Issue not found
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
