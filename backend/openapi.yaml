      summary: Raise an issue or query
      description: |-
        **User story 4.3 - Raise an Issue or Query** (Epic 4 - Communication and Issue Tracking)

        > As a student, I want to submit a formal issue or query about my registration, membership, or certificate directly through the platform, so that my concern is tracked and gets a response without me having to DM the club leader personally.

        Submits a tracked query to a club's leaders, created with status `OPEN`.

        The value over a direct message is that the query is *recorded*: it lands in the leader's queue with an id, and the student can follow it through `GET /issues` instead of wondering whether a DM was seen.

        `category` routes the query, and `event_id` may be attached to tie a question to a specific event - which is what makes a `CERTIFICATE` or `EVENT` query answerable without a back-and-forth to establish what it is about.

        **Access.** `STUDENT` token. Any verified student of the club's college; club membership is not required.

        **Notes.**

        * `event_id` is optional, but when supplied it must belong to the club named in `club_id`, otherwise `404 Event not found`.
        * The club must be `ACTIVE`.
        * Membership is not required - a student may query a club before joining it.
