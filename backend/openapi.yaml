tags:
- name: Auth
  description: |-
    Account creation and login. The only public endpoints in the API. Both return an access token and a refresh token.

    Signup is also the point at which a user's role is decided: an email whose domain matches a registered college produces a `STUDENT`, while an unregistered domain produces a `CAMPUS_ADMIN` who is expected to complete college onboarding next.

    **Implements user story 1.2.**
- name: College Onboarding
  description: |-
    Registration of an institution and its verified student email domain. Run once per college by the campus council admin, immediately after admin signup.

    Onboarding is what makes every later request tenant-scoped: the `email_suffix` routes future signups to this college, and the college id derived from it filters every club, event, announcement and issue query.

    **Implements user story 1.1.**
- name: Clubs
  description: |-
    The club directory, club profiles, the club registration and approval workflow, and membership management.

    Club status lifecycle: `PENDING` -> `ACTIVE` or `REJECTED` on the admin's decision, and `ARCHIVED` when a leader deletes the club. Only `ACTIVE` clubs are visible to students, accept join requests, or can host events and announcements.

    Membership status lifecycle: `PENDING` on request -> `APPROVED` or `REJECTED` by the leader. Only an `APPROVED` membership grants event registration and the announcement feed.

    **Implements user stories 2.1 - 2.6.**
- name: Events
  description: |-
    The full event lifecycle: creation, publication, registration, attendance and results.

    Event status lifecycle: `DRAFT` on creation -> `PUBLISHED` when the leader publishes -> `CANCELLED` if plans change. A `DRAFT` event is visible only to the leaders of the hosting club and to campus admins; registration requires `PUBLISHED`.

    Registration result lifecycle: `REGISTRANT` on sign-up -> `WINNER`, `RUNNER_UP` or `PARTICIPANT` once the leader records an outcome, which is permitted only after the student has been checked in.

    **Implements user stories 3.1 - 3.7.**
- name: Announcements
  description: |-
    One-to-many club communication. A leader posts once and every approved member of the club receives it in a single consolidated feed, replacing repeated messages across WhatsApp, Instagram and email.

    Unread state is tracked with a single `announcements_seen_at` watermark per student rather than per-announcement read receipts: anything created after the watermark is `unread: true`, and `POST /announcements/read-all` moves the watermark to now.

    **Implements user stories 4.1 and 4.2.**
- name: Issues
  description: |-
    In-platform query tracking, so that a member's question about a registration, a membership or a certificate is recorded and answerable instead of arriving as a direct message to the leader.

    Issue status lifecycle: `OPEN` on submission -> `IN_PROGRESS` when the leader replies -> `RESOLVED` when the leader closes it. A `RESOLVED` issue is terminal and accepts neither further replies nor a second resolve.

    **Implements user stories 4.3 and 4.4.**
- name: Notifications
  description: |-
    The student's inbox of platform events. Notifications are never created directly by a client; they are written as a side effect of a leader approving a join request, a student registering for an event, or a leader recording a result.

    Unread state here is per-notification (`is_read`), unlike announcements which use a single watermark.

    **Cross-cutting: supports stories 2.3, 2.4, 3.2 and 3.5.**
paths:
  /auth/signup:
    post:
      tags:
      - Auth
      summary: Create an account
      description: |-
        **User story 1.2 - Sign Up and Log In** (Epic 1 - Platform Foundation)

        > As a registered user (new student or club leader), I want to create an account with my college email and log in with one set of credentials, so that I am recognized as a verified member of my institution without any manual approval step.

        Creates an account and returns a usable token pair immediately - there is no email confirmation step and no manual approval queue.

        **The email domain decides the outcome**, which is how a student is verified as belonging to their institution without anyone vetting them by hand:

        | `role` sent | Email domain | Result |
        |---|---|---|
        | `STUDENT` | Matches a registered college | Account created and attached to that college, plus a student profile. `college_slug` is set in the token |
        | `STUDENT` | Matches no college | `404 College not registered` |
        | `CAMPUS_ADMIN` | Matches no college | Account created with a campus admin profile and no college yet. Onboarding is the expected next call |
        | `CAMPUS_ADMIN` | Matches a registered college | `409 College already registered` - a college may have only one admin signup route |

        **Access.** Public. No token required.

        **Notes.**

        * `email` is trimmed and lower-cased before the uniqueness check, so `A@X.COM` and `a@x.com` are the same account.
        * The password is hashed before storage; it is never returned by any endpoint.
        * A `CAMPUS_ADMIN` created here has no college until `POST /college/onboarding` succeeds. Until then, every college-scoped read returns `404 College not registered`.
      operationId: signup_auth_signup_post
      x-epic: Epic 1 - Platform Foundation
      x-user-story: '1.2'
      x-user-story-title: Sign Up and Log In
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '200':
          description: Account created. Returns an access token and a refresh token, ready to use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '404':
          description: |-
            The record does not exist, belongs to another college, or is not visible to the caller.

            * `College not registered` - `role` is `STUDENT` but no registered college owns that email domain. The college must be onboarded first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                college_missing:
                  summary: College not registered
                  value:
                    message: College not registered
        '409':
          description: |-
            The request conflicts with a record that already exists.

            * `Email already registered` - An account already exists for this email.
            * `College already registered` - `role` is `CAMPUS_ADMIN` but this email domain is already registered to a college.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                email_taken:
                  summary: Email already registered
                  value:
                    message: Email already registered
                college_taken:
                  summary: College already registered
                  value:
                    message: College already registered
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in
      description: |-
        **User story 1.2 - Sign Up and Log In** (Epic 1 - Platform Foundation)

        > As a registered user (new student or club leader), I want to create an account with my college email and log in with one set of credentials, so that I am recognized as a verified member of my institution without any manual approval step.

        Exchanges credentials for a fresh token pair. The same endpoint serves students, club leaders and campus admins - the returned token's `role` claim, not a separate login route, is what distinguishes them.

        **Access.** Public. No token required.

        **Notes.**

        * An unknown email and a wrong password both return the same `401 Incorrect email or password`, so the response cannot be used to enumerate registered accounts.
        * The token carries `college_slug`, letting a client scope its UI without an extra call.
      operationId: login_auth_login_post
      x-epic: Epic 1 - Platform Foundation
      x-user-story: '1.2'
      x-user-story-title: Sign Up and Log In
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authenticated. Returns an access token and a refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Incorrect email or password` - The email is not registered, or the password does not match. Deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_credentials:
                  summary: Incorrect email or password
                  value:
                    message: Incorrect email or password
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
