      tags:
      - Events
      summary: Mark attendance for a participant
      description: |-
        **User story 3.4 - Mark Attendance at an Event** (Epic 3 - Event Lifecycle)

        > As a club leader, I want to mark which registered students actually attended on the day of the event, so that certificates and results are issued only to genuine attendees without any post-event spreadsheet comparison.

        Records whether one registered student actually turned up, stamping `checked_in_at` when they did.

        Attendance is the gate on the rest of the post-event flow: a result cannot be set for a student who was never checked in, which is what guarantees outcomes and participation records reflect genuine attendance rather than mere registration.

        **Only once the event has started.** Marking attendance before `starts_at` returns `403`, so a roster cannot be pre-filled.

        **Access.** `STUDENT` token **and** a `LEADER` membership on the hosting club.

        **Notes.**

        * Sending `checked_in: false` un-marks a previous check-in **and resets any recorded result back to `REGISTRANT`**, keeping the two consistent - a result never outlives the attendance that justified it.
        * The call is idempotent: marking an already checked-in student again is accepted.
        * A `registration_id` belonging to a different event returns `404`.
      operationId: mark_attendance_events__event_id__registrations__registration_id__attendance_patch
      x-epic: Epic 3 - Event Lifecycle
      x-user-story: '3.4'
      x-user-story-title: Mark Attendance at an Event
      x-required-role:
      - STUDENT
      x-required-club-role: LEADER
      parameters:
      - name: event_id
        in: path
        required: true
        description: Id of an event hosted by a club the caller leads.
        schema:
          type: integer
          title: Event Id
      - name: registration_id
        in: path
        required: true
        description: Id of the registration, taken from `GET /events/{event_id}/registrations`.
        schema:
          type: integer
          title: Registration Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAttendanceRequest'
      responses:
        '200':
          description: The registration after attendance was marked or un-marked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted, or the resource state blocks the action.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
            * `Only the club leader can perform this action` - The caller does not hold a `LEADER` membership on the target club.
            * `Attendance can only be marked once the event has started` - The current time is before the event's `starts_at`.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NotAuthenticated'
                - $ref: '#/components/schemas/Error'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
                not_leader:
                  summary: Only the club leader can perform this action
                  value:
                    message: Only the club leader can perform this action
                too_early:
                  summary: Attendance can only be marked once the event has started
                  value:
                    message: Attendance can only be marked once the event has started
        '404':
          description: |-
            The record does not exist, belongs to another college, or is not visible to the caller.

            * `Student profile not found` - The token is valid but the account has no student profile attached.
            * `Event not found` - No such event, or it belongs to another college.
            * `College not registered` - The calling account is not attached to any college.
            * `Registration not found` - No such registration, or it belongs to a different event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                student_profile_missing:
                  summary: Student profile not found
                  value:
                    message: Student profile not found
                event_not_found:
                  summary: Event not found
                  value:
                    message: Event not found
                college_missing:
                  summary: College not registered
                  value:
                    message: College not registered
                registration_not_found:
                  summary: Registration not found
                  value:
                    message: Registration not found
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
      security:
      - HTTPBearer: []
  /events/{event_id}/registrations/{registration_id}/result:
    patch:
      tags:
      - Events
      summary: Set a participant's result
      description: |-
        **User story 3.5 - Set a Result for Each Attendee** (Epic 3 - Event Lifecycle)

        > As a club leader, I want to assign a result - Winner, Runner-up, or Participant - to each student who attended, so that outcomes are permanently recorded and not lost in WhatsApp messages after the event ends.

        Records the outcome for one checked-in attendee as `WINNER`, `RUNNER_UP` or `PARTICIPANT`.

        This is what makes results permanent. The record lives on the student's profile through `GET /events/me/results` instead of in a message that scrolls away, which is the difference between a participation history that survives the year and one that nobody can reconstruct.

        **The student must be checked in first.** Setting a result on a registration that was never marked present returns `400 Result can only be set for attendees who were checked in`.

        **Side effect:** a `RESULT_POSTED` notification is written to the student.

        **Access.** `STUDENT` token **and** a `LEADER` membership on the hosting club.

        **Notes.**

        * `REGISTRANT` cannot be set explicitly - it is the default assigned on registration, not an outcome. Sending it returns `422`.
        * A result may be changed by calling again; the notification is written each time.
        * Un-marking attendance afterwards resets the result to `REGISTRANT`.
        * There is no restriction on how many students receive `WINNER`; that judgement is left to the leader.
      operationId: set_result_events__event_id__registrations__registration_id__result_patch
      x-epic: Epic 3 - Event Lifecycle
      x-user-story: '3.5'
      x-user-story-title: Set a Result for Each Attendee
      x-required-role:
      - STUDENT
      x-required-club-role: LEADER
      parameters:
      - name: event_id
        in: path
        required: true
        description: Id of an event hosted by a club the caller leads.
        schema:
          type: integer
          title: Event Id
      - name: registration_id
        in: path
        required: true
        description: Id of the registration, taken from `GET /events/{event_id}/registrations`.
        schema:
          type: integer
          title: Registration Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetResultRequest'
      responses:
        '200':
          description: The registration after the result was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: |-
            The request is well formed but the target record is in a state that forbids it.

            * `Result can only be set for attendees who were checked in` - The registration is not checked in. Mark attendance first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
