        |---|---|
        | `JOIN_APPROVED` / `JOIN_REJECTED` | A leader decides the caller's join request |
        | `REGISTRATION_CONFIRMED` | The caller registers for an event |
        | `RESULT_POSTED` | A leader records the caller's result |
