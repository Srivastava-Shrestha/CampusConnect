      - message
      title: UnregisterResponse
      description: Confirmation that a registration was cancelled.
    UpdateClubRequest:
      properties:
        description:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 5
          - type: 'null'
          title: Description
        category:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 2
          - type: 'null'
          title: Category
        image_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Image Url
        links:
          anyOf:
          - items:
              $ref: '#/components/schemas/ClubLinkSchema'
            type: array
          - type: 'null'
          title: Links
      type: object
      title: UpdateClubRequest
      description: Editable club fields. Every field is optional and only the ones supplied are changed.
        `name` and `type` are immutable after creation. Supplying `links` replaces the whole link list;
        omitting it leaves the existing links untouched.
    UpdateEventRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 3
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 5
          - type: 'null'
          title: Description
        venue:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 2
          - type: 'null'
          title: Venue
        starts_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Starts At
        ends_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ends At
        capacity:
          anyOf:
          - type: integer
            maximum: 100000.0
            minimum: 1.0
          - type: 'null'
          title: Capacity
        image_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Image Url
      type: object
      title: UpdateEventRequest
      description: Editable event fields. Every field is optional and only the ones supplied are changed.
        The resulting window must still end after it starts, whether the bound comes from this request
        or from the stored event.
    UserRole:
      type: string
      enum:
      - STUDENT
      - CAMPUS_ADMIN
      title: UserRole
      description: |-
        Account role, decided at signup and carried in the JWT `role` claim.

        * `STUDENT` - a student of a registered college. May also be a club leader, which is a per-club membership role rather than a separate account role.
        * `CAMPUS_ADMIN` - campus council admin. Onboards the college and decides club registrations.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
      description: One field-level validation failure. `loc` is the path to the offending field, for example
        `["body", "password"]`.
    Error:
      type: object
      title: Error
      description: |-
        The standard error envelope. Every `AppException` raised by the API is serialised into this single-key shape by a global exception handler.

        Two responses do not use it: a missing `Authorization` header returns `{"detail": "Not authenticated"}` and a schema validation failure returns `HTTPValidationError`.
      properties:
        message:
          type: string
          title: Message
          description: Human-readable description of what went wrong. The exact strings are catalogued
            in section 4.3 of the API description.
      required:
      - message
      examples:
      - message: Only the club leader can perform this action
    NotAuthenticated:
      type: object
      title: NotAuthenticated
      description: Returned by the bearer security scheme when the `Authorization` header is missing or
        malformed. This is the only error shape that uses `detail` for a single string rather than the
        `message` envelope.
      properties:
        detail:
          type: string
          title: Detail
          examples:
          - Not authenticated
      required:
      - detail
      examples:
      - detail: Not authenticated
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT bearer authentication. Obtain a token from `POST /auth/signup` or `POST /auth/login` and send it as `Authorization: Bearer <access_token>`.

        The token carries the claims `sub`, `full_name`, `email`, `role`, `college_slug`, `iat`, `exp` and `type`. Only a token whose `type` is `access` is accepted, so a refresh token cannot be used to call a resource endpoint.

        A missing header is rejected with `403 {"detail": "Not authenticated"}`; a token that is malformed, expired, of the wrong type, or whose `role` is not permitted on the endpoint is rejected with `401 {"message": "Invalid token"}`.
