      description: |-
        Whether a club claims official institutional recognition. Determines the status a newly created club starts in.

        * `OFFICIAL` - requires campus admin approval, so it is created `PENDING`.
        * `UNOFFICIAL` - a student-run community that needs no approval, so it is created `ACTIVE` and is immediately joinable.
