          title: Email
        full_name:
          type: string
          maxLength: 100
          minLength: 5
          title: Full Name
        password:
          type: string
          maxLength: 255
          minLength: 8
          title: Password
        confirm_password:
          type: string
          maxLength: 255
          minLength: 8
          title: Confirm Password
        role:
          $ref: '#/components/schemas/UserRole'
      type: object
      required:
      - email
      - full_name
      - password
      - confirm_password
      - role
      title: SignupRequest
      description: 'New account details. The email domain decides the outcome: a domain matching a registered
        college creates a `STUDENT` attached to it, while an unregistered domain is valid only for `CAMPUS_ADMIN`.
        Email is lower-cased and trimmed, and the two password fields must match.'
    SignupResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        message:
          type: string
          title: Message
      type: object
      required:
      - access_token
      - refresh_token
      - message
      title: SignupResponse
      description: Issued token pair for the newly created account, plus a confirmation message.
    UnreadCountResponse:
      properties:
        count:
          type: integer
          title: Count
