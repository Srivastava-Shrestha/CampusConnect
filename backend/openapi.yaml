      description: |-
        Subject area of a member's query, used to route and filter the leader's queue.

        * `EVENT` - about a specific event or registration. Pair with `event_id`.
        * `CLUB` - about membership or club operations.
        * `CERTIFICATE` - about participation proof.
        * `TECHNICAL` - a platform problem.
        * `GENERAL` - anything else.
