      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      title: IssueStatus
      description: |-
        Lifecycle state of an issue.

        * `OPEN` - submitted, no reply yet. Counted by `GET /issues/club/open-count`.
        * `IN_PROGRESS` - the leader has replied but has not closed it.
        * `RESOLVED` - terminal. Accepts no further replies.
