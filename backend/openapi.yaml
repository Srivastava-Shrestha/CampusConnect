      x-epic: Epic 3 - Event Lifecycle
      x-user-story: '3.2'
      x-user-story-title: Register for an Event
      x-required-role:
      - STUDENT
      x-required-club-role: MEMBER
      parameters:
      - name: event_id
        in: path
        required: true
        description: Id of the published event to register for.
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Seat secured. Returns the unique `registration_id` along with the event title,
            venue and start time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationConfirmation'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted, or the resource state blocks the action.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
            * `Event is not open for registration` - The event is `DRAFT` or `CANCELLED`.
            * `Registration for this event is closed` - The event has already started.
            * `Only approved club members can register for this event` - The caller has no `APPROVED` membership of the hosting club.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NotAuthenticated'
                - $ref: '#/components/schemas/Error'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
                not_published:
                  summary: Event is not open for registration
                  value:
                    message: Event is not open for registration
                closed:
                  summary: Registration for this event is closed
                  value:
                    message: Registration for this event is closed
                not_member:
                  summary: Only approved club members can register for this event
                  value:
                    message: Only approved club members can register for this event
        '404':
          description: |-
            The record does not exist, belongs to another college, or is not visible to the caller.

            * `Student profile not found` - The token is valid but the account has no student profile attached.
            * `Event not found` - No such event, or it belongs to another college.
            * `College not registered` - The calling account is not attached to any college.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                student_profile_missing:
                  summary: Student profile not found
                  value:
                    message: Student profile not found
                event_not_found:
                  summary: Event not found
                  value:
                    message: Event not found
                college_missing:
                  summary: College not registered
                  value:
                    message: College not registered
        '409':
          description: |-
